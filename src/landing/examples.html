<section class="fc-section" id="examples">
    <h2 class="fc-section-title">Ready-made lessons you can use right away</h2>
    <div class="row g-3 g-lg-4">
        <div class="col-lg-4 col-sm-6">
            <div class="fc-card fc-example-card js-lesson-preview-card"
                 data-preview-src="{% static 'images/home/english-lesson-card.webp' %}"
                 data-preview-alt="English lesson card: Speaking and Writing">
                <div class="fc-example-title">English</div>
                <div class="fc-example-count">12 activities</div>
                <img src="{% static 'images/home/english-lesson-card-360.webp' %}"
                     srcset="{% static 'images/home/english-lesson-card-360.webp' %} 360w, {% static 'images/home/english-lesson-card-480.webp' %} 480w, {% static 'images/home/english-lesson-card-640.webp' %} 640w, {% static 'images/home/english-lesson-card-768.webp' %} 768w, {% static 'images/home/english-lesson-card.webp' %} 1472w"
                     sizes="(min-width: 1400px) 362px, (min-width: 1200px) 348px, (min-width: 992px) 420px, (min-width: 576px) calc(50vw - 36px), calc(100vw - 60px)"
                     alt="English lesson card: Speaking and Writing" class="fc-example-preview" width="1472" height="828" loading="lazy" fetchpriority="low" decoding="async">
            </div>
        </div>

        <div class="col-lg-4 col-sm-6">
